<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Tela do computador -->
  <rect width="128" height="128" fill="#1E1E1E" rx="10" ry="10"/>
  
  <!-- Fundo da tela (degradê do céu) -->
  <defs>
    <linearGradient id="ceuDegrade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000033"/> <!-- Azul quase preto -->
      <stop offset="100%" stop-color="#1E90FF"/> <!-- Azul claro -->
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="88" height="68" fill="url(#ceuDegrade)" rx="8" ry="8"/>
  
  <!-- Semicírculo laranja (sol na parte inferior) -->
  <defs>
    <linearGradient id="solDegrade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4500"/> <!-- Laranja forte -->
      <stop offset="100%" stop-color="#FFA500"/> <!-- Laranja mais claro -->
    </linearGradient>
  </defs>
  <!-- Sol ajustado para tocar as bordas laterais e seguir o formato da moldura na parte inferior -->
  <path d="M 19 64 Q 64 48, 109 64 L 109 86 Q 109 86, 106 89 Q 104 90, 102 90 L 26 90 Q 24 90, 22 88 Q 20 86, 19 84 Z" fill="url(#solDegrade)"/>
  
  <!-- Moldura da tela -->
  <rect x="18" y="18" width="92" height="72" fill="none" stroke="#FFFFFF" stroke-width="2" rx="10" ry="10"/>
  
  <!-- Cronômetro (ícone preto e branco) -->
  <g transform="translate(64, 64) scale(0.8)">
    <!-- Círculo do cronômetro -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    
    <!-- Ponteiro das horas (09:36) -->
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" transform="rotate(-162)"/> <!-- 9 horas + 36 minutos -->
    
    <!-- Ponteiro dos minutos (09:36) -->
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" transform="rotate(-216)"/> <!-- 36 minutos -->
    
    
    
  </g>
  
  <!-- Base do monitor -->
  <rect x="62" y="90" width="4" height="10" fill="#FFF"/> <!-- Haste da base -->
  <rect x="50" y="100" width="28" height="4" fill="#FFF" rx="2" ry="2"/> <!-- Base inferior -->
</svg>
